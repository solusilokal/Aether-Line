        return () => window.removeEventListener('scroll', handleScroll);

        setLightbox({ isOpen: true, image: imgSrc });
        document.body.style.overflow = 'hidden'; 
      };

      const closeLightbox = () => {
        setLightbox({ isOpen: false, image: null });

      };

        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('name');
        const rentDate = formData.get('rentDate');
        const outfitType = formData.get('outfitType');
        const notes = formData.get('notes');
        const waUrl = `https://wa.me/${pageData.phone}?text=Halo%20Admin%20${encodeURIComponent(pageData.name)},%20saya%20${encodeURIComponent(name)}.%20Saya%20ingin%20bertanya%20ketersediaan%20untuk%20sewa%20*${encodeURIComponent(outfitType)}*%20pada%20tanggal%20*${encodeURIComponent(rentDate)}*.%0A%0ACatatan%20Tambahan:%20${encodeURIComponent(notes || '-')}`;
        window.open(waUrl, '_blank');
      };

      const handleShare = async () => {
        try {
          const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
          if (isHttp && typeof navigator.share === 'function') {
            const shareData = { title: pageData.name, text: pageData.title, url: window.location.href };
            let canShare = false;
            try {
              canShare = typeof navigator.canShare === 'function' ? navigator.canShare(shareData) : true;
            } catch {
              canShare = false;
            }
            if (canShare) {
              await navigator.share(shareData);
              return;
            }
          }
        } catch (err) {
          // User cancelled or share failed
        }
        setShowShareModal(true);
      };

      const copyToClipboard = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(window.location.href).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
        } else {
          const tempInput = document.createElement('input');
          tempInput.value = window.location.href;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);

                      <Icon name="message-circle" size={26} />
                    </button>
                    <span className="text-[11px] font-semibold text-stone-600 text-center">WhatsApp</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
